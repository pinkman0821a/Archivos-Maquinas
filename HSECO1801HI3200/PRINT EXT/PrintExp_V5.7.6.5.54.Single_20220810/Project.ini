//------------------------------------------------
[PROJECT_CONFIG]

;软件模式（0：联机，1：调试 ）
PROJECT_MODE=0

;是否显示编译号
SHOW_VER_COMPILE=1

//------------------------------------------------
;到期间隔提示时间（单位：小时）
LOCK_TIP_TIME=12

//------------------------------------------------
;通信配置
[COMM_CONFIG]

;通信类型(0:USB, 1:TCP)
DEFAULT_COMM_TYPE=1

;板卡默认IP
ServerIP=192.168.127.10

;板卡默认TCP端口
ServerPort=5001
//------------------------------------------------
[LAYOUT]
;1表示布局1,2表示布局2
LAYOUT_SEL=1


//------------------------------------------------
[TCP_IP]
;边锐边打
ADDR=127.0.0.1
PORT=9100

//------------------------------------------------
;时钟显示  
[MB_CLOCK]

;1显示, 其他不显示
SHOW_MB_CLOCK=0

//------------------------------------------------
;日志显示
[LOG_CONFIG]
SHOW_LOG_TYPE=29

//------------------------------------------------
[UNIT]
UNIT_SEL=0
MEASUREMENT_UNIT=0
