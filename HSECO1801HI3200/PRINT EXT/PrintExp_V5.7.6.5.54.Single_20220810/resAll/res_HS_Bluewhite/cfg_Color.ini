;此配置文件适配于Bluewhite版本

;页面标题栏
[APP_TITLE]

;页面标题-Normal状态下文本字体颜色
APP_TITLE_NORMAL_TEXT_COLOR=RGB(255,255,255)

;页面标题-Active状态下文本字体颜色
APP_TITLE_ACTIVE_TEXT_COLOR=RGB(255,255,255)

;状态栏
[STATUS_BAR]

;状态栏-字体颜色
KEY_STATUS_BAR_TEXT_COLOR=RGB(255,255,255)

;状态栏-状态字体颜色
KEY_STATUS_BAR_TEXT_COLOR_STATUS=RGB(63,104,149)

;打印界面
[APP_PRINT]
;打印信息栏背景颜色
KEY_PRINT_INFO_COLOR_BK=RGB(255,255,255)

;打印信息栏字体颜色
KEY_PRINT_INFO_TEXT_COLOR=RGB(102,102,102)

;打印信息栏Allow颜色
